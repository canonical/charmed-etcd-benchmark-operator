# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm

platforms:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    override-build: |
      craftctl default
      cp -r templates "$CRAFT_PART_INSTALL/templates"
  extra-files:
    plugin: dump
    source: .
    stage:
      - icon.svg
